; settings of DDrawCompat for ENGINE.exe of the original Sea Dogs; the installer copies this file next to ENGINE.exe
; 16-bit colour of the game stays 16-bit also on a 32-bit desktop (otherwise the picture is purple/green and only the left half wide)
DesktopColorDepth=16
; the picture of any resolution is stretched to the screen with its own aspect ratio (4:3 gets bars at the sides)
DisplayAspectRatio=app
FullscreenMode=borderless
; the resolutions that Config.exe and the game see (the default list ends at 1024x768, so the list in Config.exe was empty; Config.exe shows no more than 9 of them)
SupportedResolutions=native, 800x600, 1024x768, 1280x960, 1600x1200, 1920x1080, 1920x1200, 2560x1440, 3840x2160
; MSAA from DDrawCompat itself (the game only draws through DDraw/D3D7, the driver profile cannot reach it); msaa2x / msaa4x / msaa8x / off
Antialiasing=msaa4x
